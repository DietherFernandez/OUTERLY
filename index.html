body .item .pic .s,body .item:hover:not(.is-facing) .pic .s,body .item:focus-visible:not(.is-facing) .pic .s{transform:rotateY(0deg);opacity:1;transition:transform .78s cubic-bezier(.22,.78,.22,1),opacity .42s ease}

{n:"Rosé Zip Hoodie",p:1999,v:"v4",d:"Preview colorway: soft rosé na bagay sa aesthetic na ootd."},

];

function layoutRack(){
 const start=Math.max(0,Math.min(P.length-4,currentIndex-1));
 items.forEach((b,i)=>{
  const slot=i-start,visible=slot>=0&&slot<4;

function collapseRack(i){if(expandedIndex===i){expandedIndex=-1;layoutRack()}}
P.forEach((j,i)=>{
 const b=document.createElement("button");b.className="item "+j.v;b.setAttribute("aria-label",`Inspect ${j.n}, ${fmt(j.p)}`);b.setAttribute("aria-pressed","false");b.type="button";
 b.innerHTML=`<svg class="hk hb" viewBox="0 0 600 400"><path d="M300 52C262 52 258 88 264 118C268 142 288 156 299 176" fill="none" stroke="#6b6964" stroke-width="14" stroke-linecap="round"/></svg><i class="rs"></i><div class="pic"><img class="s" src="${IMG.s}" alt=""><img class="f" src="${IMG.f}" alt=""></div><svg class="hk hf" viewBox="0 0 600 400"><path d="M300 52C338 52 342 88 336 118C332 142 312 156 301 176L300 263" fill="none" stroke="#8e8c86" stroke-width="14" stroke-linecap="round"/><path d="M300 52C338 52 342 88 336 118C332 142 312 156 301 176L300 263" fill="none" stroke="#e4e0d6" stroke-width="4.5" stroke-linecap="round" transform="translate(-2 -1)"/></svg><div class="tag"><b>${j.n}</b><span>${fmt(j.p)}</span></div>`;
 b.style.left=XS[Math.min(i,3)]+'%';items.push(b);b.style.setProperty('--r',['-1.3deg','.7deg','-.6deg','1.2deg'][i%4]);if(!touch){
 b.addEventListener('focus',()=>{if(!b.classList.contains('is-hidden'))expandRack(i)});
 b.addEventListener('blur',()=>collapseRack(i));
}
b.onclick=()=>{if(touch){if(expandedIndex!==i){expandRack(i);return}open(j);return}open(j)};stage.appendChild(b)});
setActive(0);
/* Stable hover zones use original rail positions, not moving element boundaries. */
if(!touch){
 stage.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  const r=stage.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
  if(y<46||y>90){if(expandedIndex!==-1){expandedIndex=-1;layoutRack()}return}
  const start=Math.max(0,Math.min(P.length-4,currentIndex-1));
  let slot=-1,distance=Infinity;
  XS.forEach((pos,k)=>{const d=Math.abs(x-pos);if(d<distance){distance=d;slot=k}});
  const chosen=distance<=5.2?start+slot:-1;
  if(chosen!==expandedIndex){expandedIndex=chosen;layoutRack()}
 },{passive:true});
 stage.addEventListener('pointerleave',()=>{if(expandedIndex!==-1){expandedIndex=-1;layoutRack()}});
}
function navigate(step){setActive((currentIndex+step+P.length)%P.length);if(narrowScreen.matches)centerRack(true)}
document.getElementById("rack-prev").addEventListener("click",()=>navigate(-1));
document.getElementById("rack-next").addEventListener("click",()=>navigate(1));
let cart=0,size="M",previousFocus=null;
const m=document.getElementById("modal"),zoom=document.getElementById("zoom"),zimg=document.getElementById("zimg"),mn=document.getElementById("mn"),mp=document.getElementById("mp"),md=document.getElementById("md"),sz=document.getElementById("sz"),buy=document.getElementById("buy");
function show(v){zimg.src=IMG[v];zoom.classList.remove("z");document.querySelectorAll("#tabs button").forEach(t=>t.classList.toggle("on",t.dataset.v==v))}
function open(j){size="M";zoom.className="zoom";zimg.className=j.v;show("f");
 mn.textContent=j.n;mp.textContent=fmt(j.p);md.textContent=j.d;
 sz.innerHTML=["S","M","L","XL"].map(s=>`<button class="${s==size?"on":""}">${s}</button>`).join("");
 sz.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{size=bt.textContent;sz.querySelectorAll("button").forEach(o=>o.classList.toggle("on",o==bt))});
 buy.textContent="IDAGDAG SA CART";previousFocus=document.activeElement;m.classList.add("on");m.setAttribute("aria-hidden","false");document.body.classList.add("modal-open");document.getElementById("close").focus()}
document.querySelectorAll("#tabs button").forEach(t=>t.onclick=()=>show(t.dataset.v));
zoom.onclick=()=>zoom.classList.toggle("z");
const pan=(x,y)=>{const r=zoom.getBoundingClientRect();zimg.style.transformOrigin=Math.max(0,Math.min(100,(x-r.left)/r.width*100))+"% "+Math.max(0,Math.min(100,(y-r.top)/r.height*100))+"%"};
zoom.onmousemove=e=>{if(zoom.classList.contains("z"))pan(e.clientX,e.clientY)};
zoom.addEventListener("touchmove",e=>{if(zoom.classList.contains("z")){pan(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()}},{passive:false});
buy.onclick=()=>{cart++;document.getElementById("cart").textContent=`🛍 Cart (${cart})`;buy.textContent="NAIDAGDAG ✓"};
document.getElementById("cart").addEventListener("click",()=>{if(cart)alert(`May ${cart} item(s) sa cart counter. Full cart at checkout ay susunod na feature.`);else alert("Wala pang item sa cart.")});
const shut=()=>{if(!m.classList.contains("on"))return;m.classList.remove("on");m.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open");if(previousFocus?.isConnected)previousFocus.focus();previousFocus=null};
document.getElementById("close").addEventListener("click",shut);
m.addEventListener("click",e=>{if(e.target===m)shut()});
document.addEventListener("keydown",e=>{
 if(!m.classList.contains("on"))return;
 if(e.key==="Escape"){e.preventDefault();shut();return}
 if(e.key!=="Tab")return;
 const focusables=[...m.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);
 if(!focusables.length){e.preventDefault();return}
 const first=focusables[0],last=focusables[focusables.length-1];
 if(e.shiftKey&&(document.activeElement===first||!m.contains(document.activeElement))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&(document.activeElement===last||!m.contains(document.activeElement))){e.preventDefault();first.focus()}
});
function pick(){if(!touch)return;/* active carousel item remains stable during horizontal wall panning */}
if(touch){
 let pickScheduled=false;sc.addEventListener("scroll",()=>{if(pickScheduled)return;pickScheduled=true;requestAnimationFrame(()=>{pickScheduled=false;pick()})},{passive:true});
}
const narrowScreen=matchMedia("(max-width:700px)");
let touchStartX=0,touchStartY=0;
sc.addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
sc.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)navigate(dx<0?1:-1)},{passive:true});
let wasNarrow=false;
function centerRack(force=false){
 if(!narrowScreen.matches)return;
 if(!force&&wasNarrow)return;
 sc.scrollLeft=Math.max(0,(sc.scrollWidth-sc.clientWidth)/2);
 if(touch)pick();
 wasNarrow=true;
}
function updateShowroomViewport(){
 if(!narrowScreen.matches){wasNarrow=false;return}
 centerRack(true);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>centerRack(true),{once:true});else centerRack(true);
addEventListener("load",()=>centerRack(true),{once:true});
narrowScreen.addEventListener("change",updateShowroomViewport);
let resizeFrame=0;
addEventListener("resize",()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(updateShowroomViewport)},{passive:true});
</script>
</body>
</html>
